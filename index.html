<head>

<title>Mācāmies angliski!</title>
<meta name="description" content="Angļu valodas mācību spēle latviešu bērniem no 2 līdz 6 gadiem.">
<meta name="theme-color" content="#ffb703">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.webmanifest">

<link rel="stylesheet" href="./styles/tokens.css">

<body>
<noscript>
  <div class="noscript">Lai spēlētu, lūdzu, ieslēdz JavaScript pārlūkprogrammā.</div>
</noscript>

<!-- Every screen renders into here. The router owns this node. -->
<main id="app" class="app" aria-live="polite"></main>

<!-- The pet lives outside #app so it survives screen changes without remounting. -->
<div id="pet-layer" class="pet-layer" aria-hidden="true"></div>

<!-- Confetti / celebration effects draw here, above everything, never interactive. -->
<div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
